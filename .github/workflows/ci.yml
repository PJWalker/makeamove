name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Formatting
        run: npm run format:check
      - name: Architecture rules
        run: npm run deps
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Duplicated code
        run: npm run dup
      - name: Unit tests
        run: npm run test:coverage
      - name: Build
        run: npx vite build
