<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="72" height="72" viewBox="0 0 72 72">
  <!--
    A gilt window frame, sliced nine ways by border-image (slice 26): the
    corners keep their filigree, the edges stretch as plain double rules.
    Light falls from the top left, so the gilt is brightest there.
  -->
  <defs>
    <linearGradient id="gilt" x1="0" y1="0" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6e3a6" />
      <stop offset="0.35" stop-color="#c99a4a" />
      <stop offset="0.65" stop-color="#8d6630" />
      <stop offset="1" stop-color="#5e4220" />
    </linearGradient>
    <g id="corner">
      <!-- A raised boss on the corner, its spikes running down each edge. -->
      <path d="M2 2 L24 3.4 L7 6 L6 7 L3.4 24 Z" fill="url(#gilt)" stroke="#1d140a" stroke-width="0.6" />
      <path d="M4.5 4.5 L13 8.5 L8.5 13 Z" fill="#1d140a" opacity="0.55" />
      <rect x="5" y="5" width="6" height="6" transform="rotate(45 8 8)" fill="url(#gilt)" stroke="#1d140a" stroke-width="0.6" />
      <circle cx="8" cy="8" r="1.2" fill="#fff6d8" opacity="0.85" />
      <!-- Scrollwork curling in from both edges. -->
      <path
        d="M10 17 C10 12.5 12.5 10 17 10 M17 10 C20 10 21 12.5 19 13.8 M10 17 C10 20 12.5 21 13.8 19"
        fill="none"
        stroke="url(#gilt)"
        stroke-width="1.3"
        stroke-linecap="round"
      />
    </g>
  </defs>
  <!-- Rules: a bright outer bead and a darker inner fillet. -->
  <rect x="1.5" y="1.5" width="69" height="69" fill="none" stroke="#1a1209" stroke-width="3" />
  <rect x="1.5" y="1.5" width="69" height="69" fill="none" stroke="url(#gilt)" stroke-width="1.4" />
  <rect x="5" y="5" width="62" height="62" fill="none" stroke="url(#gilt)" stroke-width="0.7" opacity="0.6" />
  <use xlink:href="#corner" />
  <use xlink:href="#corner" transform="matrix(-1 0 0 1 72 0)" />
  <use xlink:href="#corner" transform="matrix(1 0 0 -1 0 72)" />
  <use xlink:href="#corner" transform="matrix(-1 0 0 -1 72 72)" />
</svg>
